<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise Hania</title>

<style>
body, html{
margin:0;
padding:0;
font-family:sans-serif;
overflow:hidden;
background:#ffe6f0;
}

.slide{
position:absolute;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:1s;
opacity:0;
pointer-events:none;
text-align:center;
}

.slide.show{
opacity:1;
pointer-events:auto;
}

button{
padding:12px 25px;
border:none;
border-radius:25px;
background:#ff4d88;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.countdown-boxes{
display:flex;
gap:10px;
margin-top:20px;
}

.box{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
font-size:20px;
min-width:60px;
}

.slide3 h2{
opacity:0;
transition:0.8s;
}

.line-btn{
display:none;
margin-top:10px;
}

.cake{
width:140px;
margin-top:20px;
opacity:0;
transition:1s;
}

.balloons{
position:absolute;
width:25px;
height:40px;
background:red;
border-radius:50%;
bottom:0;
display:none;
animation:fly 5s linear forwards;
}

@keyframes fly{
0%{bottom:0;}
100%{bottom:100vh;transform:translateX(60px);}
}

.letter{
width:300px;
background:white;
border-radius:12px;
padding:20px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
}

.message{
margin-top:10px;
opacity:0;
transition:1s;
font-size:14px;
}
</style>
</head>

<body>

<!-- Slide 1 -->
<div class="slide show" id="slide1">
<h1>Countdown 🎂</h1>

<div class="countdown-boxes">
<div class="box" id="hours">00</div>
<div class="box" id="minutes">00</div>
<div class="box" id="seconds">00</div>
</div>

<button onclick="nextSlide(2)">Start</button>
</div>

<!-- Slide 2 -->
<div class="slide" id="slide2">
<h1>Happy Birthday Hania 💖</h1>
<button onclick="nextSlide(3)">Continue</button>
</div>

<!-- Slide 3 -->
<div class="slide" id="slide3">

<h2 class="line line1">✨ Special Day!</h2>
<div class="line-btn btn1"><button onclick="showLine(2)">Next</button></div>

<h2 class="line line2">👀 Surprise?</h2>
<div class="line-btn btn2">
<button onclick="showLine(3)">Yes</button>
<button onclick="showLine(3)">No</button>
</div>

<h2 class="line line3">💅 Let's Go!</h2>
<div class="line-btn btn3"><button onclick="nextSlide(4)">Go</button></div>

</div>

<!-- Slide 4 -->
<div class="slide" id="slide4">
<h1>Celebrate 🎉</h1>

<button id="lightBtn">Turn on lights</button>

<img src="https://i.ibb.co/k6KpS8Z/cake.png" class="cake" id="cake">

<div class="balloons" id="b1"></div>
<div class="balloons" id="b2"></div>
<div class="balloons" id="b3"></div>
<div class="balloons" id="b4"></div>
<div class="balloons" id="b5"></div>
</div>

<!-- Slide 5 -->
<div class="slide" id="slide5">
<div class="letter">
<h2>💌 Message</h2>
<button onclick="showMessages()">Open</button>

<div class="message" id="m1">Happy Birthday 🎂</div>
<div class="message" id="m2">You are special 🫶</div>
<div class="message" id="m3">Thanks for everything 💟</div>
<div class="message" id="m4">Stay happy ❤️</div>
<div class="message" id="m5">Hania 🎉🐒</div>

</div>
</div>

<script>

// ===== INIT =====
document.addEventListener("DOMContentLoaded", function(){

window.nextSlide = function(n){
document.querySelectorAll('.slide').forEach(s=>s.classList.remove('show'));
document.getElementById('slide'+n).classList.add('show');

if(n==3){
resetSlide3();
showLine(1);
}
if(n==4){
setupSlide4();
}
};

// Countdown
let target = new Date('April 8, 2026 00:00:00').getTime();

setInterval(()=>{
let now = new Date().getTime();
let diff = target - now;

if(diff < 0) diff = 0;

document.getElementById('hours').innerText = Math.floor(diff/1000/60/60);
document.getElementById('minutes').innerText = Math.floor(diff/1000/60)%60;
document.getElementById('seconds').innerText = Math.floor(diff/1000)%60;

},1000);

// Slide 3
function resetSlide3(){
document.querySelectorAll('.line').forEach(l=>l.style.opacity=0);
document.querySelectorAll('.line-btn').forEach(b=>b.style.display='none');
}

window.showLine = function(n){

if(n==1){
document.querySelector('.line1').style.opacity=1;
document.querySelector('.btn1').style.display='block';
}

if(n==2){
document.querySelector('.line2').style.opacity=1;
document.querySelector('.btn2').style.display='block';
document.querySelector('.btn1').style.display='none';
}

if(n==3){
document.querySelector('.line3').style.opacity=1;
document.querySelector('.btn3').style.display='block';
document.querySelector('.btn2').style.display='none';
}
};

// Slide 4
function setupSlide4(){

document.getElementById('cake').style.opacity=1;

document.getElementById('lightBtn').onclick = ()=>{

['b1','b2','b3','b4','b5'].forEach(id=>{
document.getElementById(id).style.display='block';
});

document.getElementById('lightBtn').innerText="Go to Message";
document.getElementById('lightBtn').onclick=()=>nextSlide(5);

};

}

// Slide 5
window.showMessages = function(){
let msgs = ['m1','m2','m3','m4','m5'];
let delay = 0;

msgs.forEach(id=>{
setTimeout(()=>{
document.getElementById(id).style.opacity=1;
},delay);
delay+=1500;
});
};

});

</script>

</body>
  </html>
